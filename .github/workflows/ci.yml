name: CI

on:
  push:
    branches: [spring-boot-angular]
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Proof report
        uses: actions/upload-artifact@v4
        with:
          name: phase-0-proofs-${{ matrix.os }}
          path: backend/audit-engine/target/proofs/phase-0-proofs.md

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npx ng build
      - name: Test
        working-directory: frontend
        run: npx ng test --watch=false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: |
          mkdir -p audits sources
          chmod 777 audits
          cp -r samples sources/
          docker compose up -d --build
      - name: Health and login through the frontend
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8770/api/health && break; sleep 3; done
          curl -sf http://localhost:8770/api/health | grep '"database":"up"'
          curl -s -c cj -b cj http://localhost:8770/api/auth/info > /dev/null
          token=$(awk '/XSRF-TOKEN/ {print $7}' cj)
          curl -sf -c cj -b cj -H "X-XSRF-TOKEN: $token" -H "Content-Type: application/json" \
            -d '{"name":"admin"}' http://localhost:8770/api/auth/login | grep '"role":"admin"'
          curl -sf -b cj http://localhost:8770/api/me | grep '"name":"admin"'
          curl -sf http://localhost:8770/ | grep -q '<app-root>'
      - name: Tools in the backend image
        run: |
          docker compose exec -T backend sh -c 'git --version && chromium --version && osv-scanner --version | head -1 && dependency-check --version'
      - name: Scan a sample and build the reports with their PDFs
        run: |
          xsrf() { awk '/XSRF-TOKEN/ {print $7}' cj; }
          post() { curl -sf -b cj -c cj -H "X-XSRF-TOKEN: $(xsrf)" -H "Content-Type: application/json" -d "$2" "http://localhost:8770$1"; }
          post /api/projects '{"title":"Struts orders","sourcePath":"/sources/samples/struts-oracle-app"}' | grep '"id":"struts-orders"'
          scan=$(post /api/projects/struts-orders/scans '{"full":false}' | sed -E 's/.*"scan":\{"id":([0-9]+).*/\1/')
          for i in $(seq 1 100); do
            state=$(curl -sf -b cj http://localhost:8770/api/projects/struts-orders/scans/$scan | sed -E 's/.*"status":"([a-z]+)".*/\1/')
            [ "$state" = done ] || [ "$state" = failed ] || [ "$state" = cancelled ] && break; sleep 3
          done
          echo "scan: $state"; [ "$state" = done ]
          post /api/projects/struts-orders/reports '{"type":"pdf"}' > /dev/null
          for i in $(seq 1 100); do
            body=$(curl -sf -b cj http://localhost:8770/api/projects/struts-orders/reports)
            echo "$body" | grep -q '"state":"running"' || break; sleep 3
          done
          echo "$body"
          echo "$body" | grep -q '"state":"done"'
          echo "$body" | grep -q 'summary.pdf'
          curl -sf -b cj http://localhost:8770/api/admin/health | grep -o '"name":"Browser for PDFs","status":"[a-z]*"'
          curl -sf -b cj http://localhost:8770/api/admin/health | grep -o '"name":"OWASP Dependency-Check","status":"[a-z]*"'
          curl -sf -b cj http://localhost:8770/api/admin/vulndb | grep '"version":"13.0.0"'
      - name: Logs
        if: always()
        run: docker compose logs --no-color
