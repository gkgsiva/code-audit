# Exact counts the scanner must produce for this sample (checked by tests/test_samples.py).
# ORDVAL (LINKed from ORDINQ) and DATECONV (CALLed by ORDBATCH) are sub-programs, so they
# are not counted as services. ORDRPT runs through the catalogued procedure ORDRPTP.
# ORDRPT DETAIL-PARA builds a SELECT with MOVE/STRING (optional region filter, sort column from
# input) and PREPAREs it: rebuilt with 1 value hole and 1 structural hole -> manual.

inventory:
  files: 11
  input_files: 0
  loc: {code: 227, comment: 30, blank: 3}
  by_language:
    bms: {files: 1, code: 14, comment: 1, blank: 0}
    cobol: {files: 7, code: 171, comment: 22, blank: 0}
    jcl: {files: 2, code: 24, comment: 6, blank: 0}
    sql: {files: 1, code: 18, comment: 1, blank: 3}
  by_category: {job: 2, screen: 1, source: 7, sql: 1}
components:
- {name: bms, type: online-mainframe, files: 1, detected_by: folder}
- {name: cobol, type: online-mainframe, files: 5, detected_by: folder}
- {name: copybook, type: library, files: 2, detected_by: folder}
- {name: ddl, type: db, files: 1, detected_by: folder}
- {name: jcl, type: batch, files: 1, detected_by: folder}
- {name: proclib, type: batch, files: 1, detected_by: folder}
# Every kind of work found in each component (web, batch, db, ...); type is the main one.
component_roles:
  bms: [online-mainframe]
  cobol: [batch, online-mainframe]
  copybook: [library]
  ddl: [db]
  jcl: [batch]
  proclib: [batch]
unscheduled_batches: []

coverage:
  autosys: missing
  mq: missing
  cft: missing
  ddl: missing
  crontab: missing
  server-config: missing
  security: missing

# ---- phase 2: services, screens, SQL, integrations, jobs, libraries, links ----
# Lists are 'kind: name' so a change shows exactly what appeared or disappeared.

counts:
  services:
    total: 4
    by_kind: {batch-job: 1, cics-transaction: 1, cobol-program: 2}
  screens:
    total: 2
    partials: 0
    by_technology: {BMS: 2}
  sql:
    total: 6
    distinct: 6
    by_type: {SELECT: 5, UPDATE: 1}
    by_source: {embedded: 6}
    dynamic: 1
    not_parsed: 0
  stored_procedures: 0
  db_objects: {table: 3, view: 1}
  integrations:
    total: 3
    by_type: {FILE: 3}
  batch_jobs:
    total: 1
    scheduled: 1
    unscheduled: 0
    boxes: 0
    by_scheduler: {jcl: 1}
  libraries: {total: 0, declared: 0, undeclared: 0}
  entry_points: {}
  dependencies: {resolved: 11, unresolved: 0}
  findings: {ebcdic-packed-decimal: 2, no-tests: 1, pg-manual-sql: 1, sql-concatenation: 1, sql-runtime-structure: 1}
services:
- 'batch-job: ORDNIGHT'
- 'cics-transaction: ORDI'
- 'cobol-program: ORDBATCH'
- 'cobol-program: ORDRPT'
screens:
- ORDM01
- ORDM02
integrations:
- FILE DD:ORDIN [inbound]
- FILE DD:ORDOUT [outbound]
- FILE DD:RPTOUT [outbound]
batch_jobs:
- 'jcl job: ORDNIGHT'
unresolved_references: 0

# ---- phase 3: PostgreSQL grades, complexity bands, findings, dependency security ----
# Vulnerabilities come from the fixture reports in audit-inputs/security/ (no network); the
# tests run with Dependency-Check and OSV-Scanner forced "not installed".

assessment:
  findings_by_severity: {high: 1, low: 1, medium: 4}
  pg_grades: {auto: 1, manual: 1, review: 4}
  complexity:
    services: {Medium: 3, Simple: 1}
    screens: {Simple: 2}
    batch_jobs: {Medium: 1}
  vulnerable_libraries:
    total: 0
    by_severity: {}
    vulnerabilities: 0
  eol_libraries: 0
  recommendations: {}
