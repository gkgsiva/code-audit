# Exact counts the scanner must produce for this sample (checked by tests/test_samples.py).
# audit-inputs has a CFT export (partner BANKFR, flows SETTLE and SETTACK) and a crontab; the
# cron job purge_logs.sh is deliberately missing from the source -> 1 unresolved reference.
# CFT flow SETTACK is defined in the export but no script receives it: kept as '*/SETTACK'.

inventory:
  files: 8
  input_files: 2
  loc: {code: 164, comment: 18, blank: 26}
  by_language:
    c: {files: 3, code: 63, comment: 7, blank: 9}
    make: {files: 1, code: 13, comment: 1, blank: 5}
    proc: {files: 1, code: 59, comment: 5, blank: 7}
    shell: {files: 2, code: 21, comment: 4, blank: 3}
    sql: {files: 1, code: 8, comment: 1, blank: 2}
  by_category: {build: 1, script: 2, source: 4, sql: 1}
components:
- {name: settlement, type: batch, files: 8, detected_by: build-file}
coverage: {autosys: missing, mq: missing, cft: present, ddl: missing, crontab: present, server-config: missing}

# ---- phase 2: services, screens, SQL, integrations, jobs, libraries, links ----
# Lists are 'kind: name' so a change shows exactly what appeared or disappeared.

counts:
  services:
    total: 4
    by_kind: {batch-job: 2, c-executable: 2}
  screens:
    total: 0
    partials: 0
    by_technology: {}
  sql:
    total: 7
    distinct: 7
    by_type: {CALL: 1, DYNAMIC: 1, INSERT: 1, SELECT: 3, UPDATE: 1}
    by_source: {embedded: 5, script: 1, sql-file: 1}
    dynamic: 1
    not_parsed: 1
  stored_procedures: 0
  db_objects: {table: 4}
  integrations:
    total: 7
    by_type: {CFT: 2, FILE: 2, MQ: 1, MQ-QMGR: 1, SCP: 1}
  batch_jobs:
    total: 2
    boxes: 0
    by_scheduler: {cron: 2}
  libraries: {total: 0, declared: 0, undeclared: 0}
  entry_points: {main: 2}
  dependencies: {resolved: 9, unresolved: 1}
  findings: {unresolved-reference: 1}
services:
- 'batch-job: purge_logs.sh'
- 'batch-job: run_settlement.ksh'
- 'c-executable: settle_load'
- 'c-executable: settle_send'
screens: []
integrations:
- CFT */SETTACK [inbound]
- CFT BANKFR/SETTLE [outbound]
- FILE /data/settlement/out/settlement.dat [inbound]
