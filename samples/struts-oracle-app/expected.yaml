    total: 4
    by_kind: {servlet: 1, struts-action: 3}
  screens:
    total: 4
    partials: 2
    by_technology: {jsp: 4}
  sql:
    total: 14
    distinct: 13
    by_type: {CALL: 2, SELECT: 10, UPDATE: 2}
    by_source: {jdbc: 7, plsql: 3, script: 1, sql-file: 3}
    dynamic: 2
    not_parsed: 0
  stored_procedures: 1
  db_objects: {package: 1, table: 4}
  integrations:
    total: 3
    by_type: {DB: 1, SMTP: 1, SOAP: 1}
  web_services:
    total: 1
    offered: 0
    called: 1
    by_style: {SOAP called: 1}
    operations: 1
  batch_jobs:
    total: 0
    scheduled: 0
    unscheduled: 0
    boxes: 0
    by_scheduler: {}
  libraries: {total: 5, declared: 0, undeclared: 5}
  entry_points: {}
  dependencies: {resolved: 37, unresolved: 1}
  findings: {config-credential: 1, dead-code-candidate: 1, eol-library: 5, eol-technology: 4, hardcoded-endpoint: 3, pg-manual-object: 1, sql-concatenation: 1, unresolved-reference: 1, vulnerable-library: 4}
