# ---- phase 3: PostgreSQL grades, complexity bands, findings, dependency security ----
# Vulnerabilities come from the fixture reports in audit-inputs/security/ (no network); the
# tests run with Dependency-Check and OSV-Scanner forced "not installed".

assessment:
  findings_by_severity: {critical: 2, high: 4, info: 2, medium: 13}
  pg_grades: {auto: 4, review: 10}
  complexity:
    services: {Medium: 3, Simple: 1}
    screens: {Simple: 4}
    batch_jobs: {}
  vulnerable_libraries:
    total: 4
    by_severity: {critical: 2, high: 2}
    vulnerabilities: 8
  eol_libraries: 5
  recommendations: {replace: 5}
