# Exact counts the scanner must produce for this sample (checked by tests/test_samples.py).
# Maven parent + 3 modules (billing-common, billing-web, billing-batch); audit-inputs has an
# Autosys export (box, file watcher, 2 CMD jobs) and an MQSC export for queue manager QMBILL.
# The parent pom 'billing' (packaging pom) is a group of its modules, not a component
# (decision 166);
# archive_usage.sh (run by Autosys job BIL_ARCHIVE) is deliberately missing -> 1 unresolved.

inventory:
  files: 28
  input_files: 3
  loc: {code: 580, comment: 10, blank: 97}
  by_language:
    java: {files: 11, code: 221, comment: 7, blank: 69}
    jsp: {files: 5, code: 56, comment: 0, blank: 0}
    properties: {files: 1, code: 4, comment: 1, blank: 0}
    shell: {files: 1, code: 9, comment: 2, blank: 1}
    xml: {files: 10, code: 290, comment: 0, blank: 27}
  by_category: {build: 4, config: 7, screen: 5, script: 1, source: 11}
components:
- {name: billing-batch, type: batch, files: 5, detected_by: build-file}
- {name: billing-common, type: library, files: 7, detected_by: build-file}
- {name: billing-web, type: web, files: 15, detected_by: build-file}
# Every kind of work found in each component (web, batch, db, ...); type is the main one.
component_roles:
  billing-batch: [batch]
  billing-common: [library]
  billing-web: [web]
unscheduled_batches: []

coverage:
  autosys: present
  mq: present
  cft: missing
  ddl: missing
  crontab: missing
  server-config: missing
  security: present
  dependency-check: missing
  osv-scanner: present

