# C# WPF app with Entity Framework (inventory-wpf-cs), an ASP.NET Core API with Hangfire jobs
# (billing-api-cs), an ASP.NET Web Forms site with an ASMX service (legacy-webforms), a console
# program run by Windows Task Scheduler (nightly-export-cs) and a Windows service
# (invoice-mailer-svc).
#
# Checked by hand:
# - 48 files: bin/Debug and obj/Debug of the VB.NET app and the WPF app's generated
#   MainWindow.g.cs are skipped (3 build-output-skipped findings); the .frx is binary.
# - Screens: VB6 forms, Windows Forms forms (MainForm from its .Designer.vb, OrderDetailForm built
#   in code), WPF windows; ctlAddress (VB6 UserControl), ItemCard (WPF UserControl), Site.master
#   and _Layout.cshtml are partials.
# - SQL rebuilt from string building in VB6 (& and _ continuations), VB.NET (StringBuilder,
#   String.Format) and C# (+=, $"..." interpolation, StringBuilder); EF calls kept as readable
#   text (not_parsed: 2); stored procedures are CALL statements.
# - invoice-mailer-svc is a Windows service no scheduler starts: unscheduled batch.
