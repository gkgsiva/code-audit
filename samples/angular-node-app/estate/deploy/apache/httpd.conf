# Front web server: static files and proxy to WebLogic and the Node.js APIs.
ServerRoot "/opt/apache2"
Listen 80
LoadModule weblogic_module modules/mod_wl_24.so
LoadModule proxy_module modules/mod_proxy.so

<VirtualHost *:80>
  ServerName portal.acme.local
  DocumentRoot "/var/www/portal"
  <Location /portal>
    SetHandler weblogic-handler
    WebLogicHost wls1.acme.local
    WebLogicPort 7001
  </Location>
</VirtualHost>
