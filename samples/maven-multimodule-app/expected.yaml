# Exact counts the scanner must produce for this sample (checked by tests/test_samples.py).
# What it pins down (decisions 166-168):
# - the top pom.xml (acme-parent) and batches/pom.xml (acme-batches) have packaging pom: they
#   are groups, not components; each module they list is a component (acme-tools only through
#   the "tools" profile), and build_groups gives the parent chain of each;
# - acme-web is war (web), acme-ear is ear (its application.xml makes it config);
# - beside the modules, config/ is a config component and scripts/ a batch component; the
#   parent poms and README.md belong to no component (29 files, 26 in components);
# - ops/ only wraps ops/batch/, a batch folder holding several batches: purge, archive and eod
#   are batch components, and what they share (common/functions.ksh, env.properties) is the
#   component "batch" (detected_by batch-shared, type script, never a batch itself);
# - one batch per entry point: scripts/ has 2 (run_billing.ksh, run_report.ksh), eod 2, purge
#   and archive 1 each, so the batch count is 6 with no scheduler export. billing-batch and
#   report-batch are started by the scripts (their mains are steps), so they are not counted.
