  by_category: {build: 8, config: 4, doc: 1, screen: 1, script: 7, source: 5, sql: 3}
components:
- {name: acme-ear, type: config, files: 2, detected_by: build-file}
- {name: acme-parent-scripts-config, type: batch, files: 12, detected_by: grouped}
- {name: acme-tools, type: library, files: 2, detected_by: build-file}
- {name: acme-web, type: web, files: 6, detected_by: build-file}
- {name: billing-batch, type: batch, files: 2, detected_by: build-file}
- {name: report-batch, type: batch, files: 2, detected_by: build-file}
