# Exact counts the scanner must produce for this sample (checked by tests/test_samples.py).
# What it pins down (decisions 166-168 and 176):
# - the top pom.xml (acme-parent) and batches/pom.xml (acme-batches) have packaging pom: they
#   are groups, not components; each module they list is a component (acme-tools only through
#   the "tools" profile), and build_groups gives the parent chain of each;
# - grouping per deployable (decision 176): acme-web (war) depends on the library acme-core, so
#   acme-core is part of acme-web (parts [acme-web, acme-core]); acme-tools is used by no
#   deployable and stays a library; acme-ear is ear (its application.xml makes it config);
# - beside the modules, config/, scripts/ and ops/batch/ (purge, archive, eod and what they
#   share) are one component, acme-parent-scripts-config; the parent poms and README.md belong
#   to no component (29 files, 26 in components);
# - one batch per entry point, whatever component holds it: scripts/ has 2 (run_billing.ksh,
#   run_report.ksh), eod 2, purge and archive 1 each, so the batch count is 6 with no scheduler
#   export; common/functions.ksh is a shared helper. billing-batch and report-batch are started
#   by the scripts (their mains are steps), so they are not counted.
