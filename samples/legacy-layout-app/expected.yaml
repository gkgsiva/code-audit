# Exact counts the scanner must produce for this sample (checked by tests/test_samples.py).
# What it pins down (decisions 113-116):
# - compiled output is left out and reported (4 build-output-skipped findings): the Eclipse
#   output folder apps/orders-web/bin (declared in .classpath; its copy of
#   ApplicationResources.properties is not counted twice), apps/billing-batch/classes,
#   settlement-c/obj, and settlement-c/src/settle.c (generated from settle.pc by Pro*C);
# - apps/ only holds applications, so it is a container, not a component;
# - orders-web (Eclipse .project) is one web component with its Java, JSP and properties;
# - billing-batch has no build file: java/, ksh/ and properties/ are its parts, so it is one
#   batch component, not a library plus scripts;
# - settlement-c is found by Makefile.aix; config/ is a configuration component; scripts/ only
#   copies files, so it stays a script component, not a batch;
# - no scheduler export: the batch count is 2 (billing-batch, settlement-c), one per batch
#   component, not one per ksh script.
# Lines of code (decision 118): every text file is counted under its language (invoices.ctl is
# sqlloader, mail.tpl is "other (.tpl)", never "unknown"); rates.pak is binary with no NUL byte
# and is left out; run_invoices.ksh.bak (backup) and rates.dat (data) are listed with no lines.
# Integrations (decision 119): smtp.host=mail.acme.local and smtp://MAIL.acme.local:25 are one
# SMTP row, the two spellings of the BILL database one DB row, each with 2 usages.

