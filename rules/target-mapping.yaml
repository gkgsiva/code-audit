# Default target per legacy element (docs/plan.md § Target mapping rules). The scan engine only
# ships this table with the facts; the Copilot agent applies it and records exceptions with a
# reason. A team pack can replace an entry by giving the same id.
pack: target-mapping
description: Default GCP / Java 25 / Spring Boot 4 / Angular 21 / PostgreSQL target per legacy element.

data:
  targets:
    - id: screen
      legacy: JSP / JSF / Struts screen, Spring MVC view, BMS map
      applies_to: {entity: screens}
      target: Angular 21 component (route per screen, shared components for repeated forms)
    - id: spa-screen
      legacy: Angular or AngularJS screen (routed component or view)
      applies_to: {entity: screens, technologies: [angular, angularjs]}
      target: Angular 21 standalone component; AngularJS views are rewritten, Angular apps are brought up with ng update
    - id: desktop-screen
      legacy: Desktop window or form (VB6 form, Windows Forms, WPF, Java Swing / AWT, JavaFX)
      applies_to: {entity: screens, technologies: [vb6, winforms, wpf, swing, awt, javafx]}
      target: Angular 21 component in a browser app (route per window, dialogs as Angular Material dialogs); logic in the form's event handlers moves to a Spring Boot 4 service
    - id: aspnet-screen
      legacy: ASP.NET Web Forms page or MVC / Razor view
      applies_to: {entity: screens, technologies: [aspx, razor]}
      target: Angular 21 component; code-behind and controller logic moves to a Spring Boot 4 REST controller + service
    - id: dotnet-service
      legacy: ASP.NET MVC / Web API controller action, WCF or ASMX operation
      applies_to: {entity: services, kinds: [aspnet-mvc, rest-operation, soap-operation]}
      target: Spring Boot 4 REST controller + service (Spring Web Services only where a SOAP contract must be kept)
    - id: windows-service
      legacy: Windows service, Windows Task Scheduler task, Hangfire / Quartz.NET job
      applies_to: {entity: batch_jobs, schedulers: [windows-task, hangfire, quartz.net]}
      target: Spring Batch job on Cloud Run jobs started by Cloud Scheduler; long-running Windows services become a Spring Boot 4 service on GKE or Cloud Run
    - id: com-component
      legacy: VB6 COM reference or ActiveX (OCX) control
      applies_to: {entity: libraries, sources: [com]}
      target: Replaced by an Angular 21 component (UI controls) or a Java library / Spring Boot service (COM logic); no COM on GCP
    - id: node-service
      legacy: Node.js API route (Express, NestJS, Fastify, Koa, hapi)
      applies_to: {entity: services, kinds: [node-route, nest-route]}
      target: Spring Boot 4 REST controller + service, or kept on Node.js 24 in Cloud Run where the team chooses (record the exception)
    - id: app-server
      legacy: Application server (WebSphere, WebLogic, JBoss / WildFly, Tomcat, GlassFish, ...)
      applies_to: {entity: tech_stack, categories: [app-server]}
      target: Spring Boot 4 executable jar (embedded Tomcat) on GKE or Cloud Run; server data sources, JMS and security settings move to Spring configuration + Secret Manager
    - id: web-server
      legacy: Web server (Apache HTTP Server, IBM HTTP Server, Oracle HTTP Server, Nginx, IIS)
      applies_to: {entity: tech_stack, categories: [web-server]}
      target: Cloud Load Balancing with Cloud CDN; the Angular build served from Cloud Storage or an Nginx container on Cloud Run
    - id: online-service
      legacy: Struts action, Spring MVC handler, servlet, EJB, SOAP operation
      applies_to: {entity: services, kinds: [struts-action, spring-mvc, servlet, ejb, soap-operation, jax-rs]}
      target: Spring Boot 4 REST controller + service, grouped into bounded-context services
    - id: mainframe-program
      legacy: COBOL / Pro*C online program
      applies_to: {entity: services, kinds: [cics-transaction, cobol-program, proc-program]}
      target: Spring Boot service (rewritten), or rehost candidate if the logic is very large
    - id: batch-job
      legacy: Batch job (Autosys / JCL / cron + shell, C, COBOL, Spring Batch)
      applies_to: {entity: batch_jobs}
      target: Spring Batch on Cloud Run jobs or GKE; Autosys job chains → Cloud Composer, simple schedules → Cloud Scheduler + Workflows
    - id: database
      legacy: Oracle / DB2 / other database
      applies_to: {entity: db_objects}
      target: Cloud SQL for PostgreSQL or AlloyDB; procedures → Java service logic or PL/pgSQL
    - id: messaging
      legacy: IBM MQ / JMS
      applies_to: {entity: integrations, types: [MQ, JMS]}
      target: Pub/Sub, or IBM MQ kept (e.g. on GKE) where ordering or transactions require it
    - id: file-transfer
      legacy: FTP / SFTP / CFT file transfer
      applies_to: {entity: integrations, types: [FTP, SFTP, CFT]}
      target: Cloud Storage + Storage Transfer Service, or a managed SFTP gateway; events via Pub/Sub
    - id: shared-files
      legacy: Shared file system
      applies_to: {entity: integrations, types: [FILE]}
      target: Cloud Storage or Filestore
    - id: email
      legacy: Email (SMTP)
      applies_to: {entity: integrations, types: [SMTP]}
      target: SMTP relay / SendGrid with credentials in Secret Manager
    - id: config
      legacy: Config / properties
      applies_to: {entity: inventory, categories: [config]}
      target: Spring configuration + Secret Manager
    - id: reports
      legacy: Reports (Crystal, Jasper, Oracle Reports)
      applies_to: {entity: tech_stack, names: [Crystal Reports, JasperReports, Oracle Reports]}
      target: JasperReports on Spring Boot or Looker Studio, case by case
    - id: auth
      legacy: Auth (LDAP, SiteMinder, custom)
      applies_to: {entity: integrations, types: [LDAP]}
      target: Identity Platform / IAP, or the corporate IdP via OIDC
    - id: observability
      legacy: Logging, monitoring
      applies_to: {entity: tech_stack, names: [Log4j 1, Log4j 2, Logback]}
      target: Cloud Logging, Cloud Monitoring, Cloud Trace
    - id: runtime
      legacy: Runtime (app server, batch host)
      applies_to: {entity: components}
      target: GKE Autopilot or Cloud Run; CI/CD with Cloud Build + Artifact Registry
