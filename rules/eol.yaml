# End-of-life data for libraries and technologies.
#
# `libraries` entries match a library by `artifact` regex (full match), an optional `group`
# regex (checked only when the library has a group: jars found on disk often have none) and a
# version range (`versions`, see legacy_audit/security/versions.py: "<2", ">=3.0,<3.5", "*").
# `technologies` entries match a tech-stack item by `name` (full match) and `versions`.
# A library whose version is unknown is flagged only when the range is "*".
#
# Dates are the vendor's announced end of life (end of public support). A team pack in
# `rules.packs_dir` can add entries; team entries are matched first.
pack: eol
description: End-of-life frameworks, libraries and runtimes.

data:
  libraries:
    - {name: Struts 1, artifact: 'struts|struts-core', group: 'struts|org\.apache\.struts', versions: '<2', eol_date: '2013-04-05', replacement: 'Spring MVC (Spring Boot 4)'}
    - {name: Struts 2 before 6, artifact: 'struts2-core', versions: '<6', eol_date: '2023-06-30', replacement: 'Spring MVC (Spring Boot 4)'}
    - {name: Log4j 1, artifact: 'log4j', group: 'log4j', versions: '<2', eol_date: '2015-08-05', replacement: 'SLF4J + Logback (Spring Boot default)'}
    - {name: Commons Collections 3, artifact: 'commons-collections', versions: '<4', eol_date: '2015-11-12', replacement: 'org.apache.commons:commons-collections4'}
    - {name: Commons Lang 2, artifact: 'commons-lang', versions: '<3', eol_date: '2011-01-16', replacement: 'org.apache.commons:commons-lang3'}
    - {name: Spring Boot before 3, artifact: 'spring-boot(-[a-z-]+)?', group: 'org\.springframework\.boot', versions: '<3', eol_date: '2023-11-24', replacement: 'Spring Boot 4'}
    - {name: Spring Batch before 5, artifact: 'spring-batch-[a-z]+', group: 'org\.springframework\.batch', versions: '<5', eol_date: '2023-11-18', replacement: 'Spring Batch 6 (Spring Boot 4)'}
    - {name: Spring Security before 6, artifact: 'spring-security-[a-z]+', group: 'org\.springframework\.security', versions: '<6', eol_date: '2024-02-28', replacement: 'Spring Security 7 (Spring Boot 4)'}
    - {name: Spring Framework before 6, artifact: 'spring(-[a-z]+)*', group: 'org\.springframework', versions: '<6', eol_date: '2024-08-31', replacement: 'Spring Framework 7 (Spring Boot 4)'}
    - {name: Hibernate before 6, artifact: 'hibernate(3|-core|-entitymanager)?', group: 'org\.hibernate', versions: '<6', eol_date: '2022-12-31', replacement: 'Hibernate ORM 7 (Spring Boot 4)'}
    - {name: Apache Axis 1, artifact: 'axis', group: 'axis|org\.apache\.axis', versions: '*', eol_date: '2006-04-22', replacement: 'Spring Web Services or a REST client (RestClient)'}
    - {name: iBATIS, artifact: 'ibatis(-sqlmap|2-sqlmap)?', versions: '*', eol_date: '2010-06-16', replacement: 'MyBatis 3 or Spring Data JPA'}
    - {name: AngularJS, artifact: 'angular', versions: '<2', eol_date: '2021-12-31', replacement: 'Angular 21'}
    - {name: jQuery before 3.5, artifact: 'jquery', versions: '<3.5', eol_date: '2020-04-10', replacement: 'Angular 21 (or jQuery 3.7+)'}
    - {name: Oracle JDBC ojdbc14, artifact: 'ojdbc14', versions: '*', eol_date: '2013-07-31', replacement: 'org.postgresql:postgresql (target database)'}
    # Angular: each major is supported for 18 months (angular.dev/reference/releases).
    - {name: Angular before 15, artifact: '@angular/core', versions: '>=2,<15', eol_date: '2023-11-18', replacement: 'Angular 21'}
    - {name: Angular 15, artifact: '@angular/core', versions: '>=15,<16', eol_date: '2024-05-18', replacement: 'Angular 21'}
    - {name: Angular 16, artifact: '@angular/core', versions: '>=16,<17', eol_date: '2024-11-08', replacement: 'Angular 21'}
    - {name: Angular 17, artifact: '@angular/core', versions: '>=17,<18', eol_date: '2025-05-15', replacement: 'Angular 21'}
    - {name: Angular 18, artifact: '@angular/core', versions: '>=18,<19', eol_date: '2025-11-21', replacement: 'Angular 21'}
    - {name: Angular 19, artifact: '@angular/core', versions: '>=19,<20', eol_date: '2026-05-19', replacement: 'Angular 21'}

    # .NET packages (NuGet). Entity Framework Core follows the .NET release it ships with.
    - {name: Entity Framework Core before 8, artifact: 'microsoft\.entityframeworkcore(\.[a-z]+)*', versions: '<8', eol_date: '2024-11-12', replacement: 'Spring Data JPA / Hibernate ORM 7 (Spring Boot 4)'}
    - {name: Microsoft.AspNet.Mvc before 5, artifact: 'microsoft\.aspnet\.mvc', versions: '<5', eol_date: '2016-01-12', replacement: 'Spring MVC (Spring Boot 4) with an Angular 21 front end'}
  technologies:
    - {name: 'Struts 1', versions: '*', eol_date: '2013-04-05', replacement: 'Spring MVC (Spring Boot 4)'}
    - {name: 'Log4j 1', versions: '*', eol_date: '2015-08-05', replacement: 'SLF4J + Logback'}
    - {name: 'Apache Axis', versions: '*', eol_date: '2006-04-22', replacement: 'Spring Web Services or a REST client'}
    - {name: 'iBATIS', versions: '*', eol_date: '2010-06-16', replacement: 'MyBatis 3 or Spring Data JPA'}
    - {name: 'AngularJS', versions: '<2', eol_date: '2021-12-31', replacement: 'Angular 21'}
    - {name: 'Spring Framework', versions: '<6', eol_date: '2024-08-31', replacement: 'Spring Framework 7 (Spring Boot 4)'}
    - {name: 'Spring Boot', versions: '<3', eol_date: '2023-11-24', replacement: 'Spring Boot 4'}
    - {name: 'Spring Batch', versions: '<5', eol_date: '2023-11-18', replacement: 'Spring Batch 6'}
    - {name: 'Hibernate', versions: '<6', eol_date: '2022-12-31', replacement: 'Hibernate ORM 7'}
    - {name: 'Servlet API', versions: '<3', eol_date: '2013-06-12', replacement: 'Jakarta Servlet 6.1'}
    # Angular and Node.js (versions found in package.json, lock files, .nvmrc, Dockerfiles).
    - {name: 'Angular', versions: '>=2,<15', eol_date: '2023-11-18', replacement: 'Angular 21'}
    - {name: 'Angular', versions: '>=15,<16', eol_date: '2024-05-18', replacement: 'Angular 21'}
    - {name: 'Angular', versions: '>=16,<17', eol_date: '2024-11-08', replacement: 'Angular 21'}
    - {name: 'Angular', versions: '>=17,<18', eol_date: '2025-05-15', replacement: 'Angular 21'}
    - {name: 'Angular', versions: '>=18,<19', eol_date: '2025-11-21', replacement: 'Angular 21'}
    - {name: 'Angular', versions: '>=19,<20', eol_date: '2026-05-19', replacement: 'Angular 21'}
    - {name: 'Node.js', versions: '<16', eol_date: '2023-04-30', replacement: 'Node.js 24 LTS, or Spring Boot 4 (Java 25)'}
    - {name: 'Node.js', versions: '>=16,<18', eol_date: '2023-09-11', replacement: 'Node.js 24 LTS, or Spring Boot 4 (Java 25)'}
    - {name: 'Node.js', versions: '>=18,<20', eol_date: '2025-04-30', replacement: 'Node.js 24 LTS, or Spring Boot 4 (Java 25)'}
    - {name: 'Node.js', versions: '>=20,<22', eol_date: '2026-04-30', replacement: 'Node.js 24 LTS, or Spring Boot 4 (Java 25)'}
    # Application and web servers: the target is Spring Boot 4 (embedded Tomcat) on GKE or
    # Cloud Run, so every server is replaced; these are the releases out of vendor support.
    - {name: 'Oracle WebLogic Server', versions: '<12.2.1', replacement: 'Spring Boot 4 executable jar on GKE / Cloud Run'}
    - {name: 'IBM WebSphere Application Server', versions: '<8.5', eol_date: '2018-04-30', replacement: 'Spring Boot 4 executable jar on GKE / Cloud Run'}
    - {name: 'JBoss / WildFly', versions: '<7', replacement: 'Spring Boot 4 executable jar on GKE / Cloud Run'}
    - {name: 'Apache Tomcat', versions: '<8.5', eol_date: '2021-03-31', replacement: 'Spring Boot 4 (embedded Tomcat 11)'}
    - {name: 'Apache Tomcat', versions: '>=8.5,<9', eol_date: '2024-03-31', replacement: 'Spring Boot 4 (embedded Tomcat 11)'}
    - {name: 'Apache HTTP Server', versions: '<2.4', eol_date: '2017-07-11', replacement: 'Cloud Load Balancing (static files on Cloud Storage + Cloud CDN)'}
    # Java: public updates ended on these dates; the target is Java 25.
    - {name: 'Java', versions: '<1.6', eol_date: '2009-10-30', replacement: 'Java 25'}
    - {name: 'Java', versions: '>=1.6,<1.7', eol_date: '2013-02-28', replacement: 'Java 25'}
    - {name: 'Java', versions: '>=1.7,<1.8', eol_date: '2015-04-30', replacement: 'Java 25'}
    - {name: 'Java', versions: '>=1.8,<9', eol_date: '2019-01-31', replacement: 'Java 25'}
    - {name: 'Java', versions: '>=9,<11', eol_date: '2018-09-25', replacement: 'Java 25'}
    # Desktop and .NET. VB6: Microsoft ended extended support for the IDE on 2008-04-08 (the
    # runtime only "just works" on Windows). .NET Framework: 1.x, 2.0-3.0 and 4.0-4.6.1 are out
    # of support (3.5 SP1 and 4.6.2+ follow the Windows lifecycle). .NET (Core): each release
    # on its announced end date; .NET 8 and 9 end on 2026-11-10.
    - {name: 'Visual Basic 6', versions: '*', eol_date: '2008-04-08', replacement: 'Angular 21 screens with a Spring Boot 4 (Java 25) back end'}
    - {name: '\.NET Framework', versions: '<2', eol_date: '2013-10-08', replacement: 'Spring Boot 4 (Java 25)'}
    - {name: '\.NET Framework', versions: '>=2,<3.5', eol_date: '2011-07-12', replacement: 'Spring Boot 4 (Java 25)'}
    - {name: '\.NET Framework', versions: '>=4,<4.5.2', eol_date: '2016-01-12', replacement: 'Spring Boot 4 (Java 25)'}
    - {name: '\.NET Framework', versions: '>=4.5.2,<4.6.2', eol_date: '2022-04-26', replacement: 'Spring Boot 4 (Java 25)'}
    - {name: '\.NET Core', versions: '<2.1', eol_date: '2019-06-27', replacement: 'Spring Boot 4 (Java 25)'}
    - {name: '\.NET Core', versions: '>=2.1,<3.1', eol_date: '2021-08-21', replacement: 'Spring Boot 4 (Java 25)'}
    - {name: '\.NET Core', versions: '>=3.1,<4', eol_date: '2022-12-13', replacement: 'Spring Boot 4 (Java 25)'}
    - {name: '\.NET', versions: '>=5,<6', eol_date: '2022-05-10', replacement: 'Spring Boot 4 (Java 25)'}
    - {name: '\.NET', versions: '>=6,<7', eol_date: '2024-11-12', replacement: 'Spring Boot 4 (Java 25)'}
    - {name: '\.NET', versions: '>=7,<8', eol_date: '2024-05-14', replacement: 'Spring Boot 4 (Java 25)'}
    - {name: 'Entity Framework Core', versions: '<8', eol_date: '2024-11-12', replacement: 'Spring Data JPA / Hibernate ORM 7'}
    - {name: 'Silverlight', versions: '*', eol_date: '2021-10-12', replacement: 'Angular 21'}
    - {name: 'Windows Common Controls \(OCX\)', versions: '*', eol_date: '2008-04-08', replacement: 'Angular 21 components (Angular Material)'}
