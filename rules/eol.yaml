# End-of-life data for libraries and technologies.
#
# `libraries` entries match a library by `artifact` regex (full match), an optional `group`
# regex (checked only when the library has a group: jars found on disk often have none) and a
# version range (`versions`, see legacy_audit/security/versions.py: "<2", ">=3.0,<3.5", "*").
# `technologies` entries match a tech-stack item by `name` (full match) and `versions`.
# A library whose version is unknown is flagged only when the range is "*".
#
# `replacement` is the advice for the default target (Spring Boot / Angular); `by_target` gives
# it for the other targets in audit.yaml > target.profile (see legacy_audit/target.py).
#
# Dates are the vendor's announced end of life (end of public support). A team pack in
# `rules.packs_dir` can add entries; team entries are matched first.
pack: eol
description: End-of-life frameworks, libraries and runtimes.

data:
  libraries:
    - {name: Struts 1, artifact: 'struts|struts-core', group: 'struts|org\.apache\.struts', versions: '<2', eol_date: '2013-04-05', replacement: 'Spring MVC (Spring Boot 4)', by_target: {wildfly-gke: {replacement: 'Struts 7 (Jakarta EE); to keep the Struts 1 code as it is on WildFly 41, convert its jars to jakarta.* with the Eclipse Transformer'}, none: {replacement: 'Struts 7 (Jakarta EE) or Jakarta Faces; Struts 1 has no Jakarta EE version'}}}
    - {name: Struts 2 before 6, artifact: 'struts2-core', versions: '<6', eol_date: '2023-06-30', replacement: 'Spring MVC (Spring Boot 4)', by_target: {'wildfly-gke,none': {replacement: 'Struts 7 (Jakarta EE)'}}}
    - {name: Log4j 1, artifact: 'log4j', group: 'log4j', versions: '<2', eol_date: '2015-08-05', replacement: 'SLF4J + Logback (Spring Boot default)', by_target: {'wildfly-gke,none': {replacement: 'Log4j 2 or SLF4J + Logback'}}}
    - {name: Commons Collections 3, artifact: 'commons-collections', versions: '<4', eol_date: '2015-11-12', replacement: 'org.apache.commons:commons-collections4'}
    - {name: Commons Lang 2, artifact: 'commons-lang', versions: '<3', eol_date: '2011-01-16', replacement: 'org.apache.commons:commons-lang3'}
    - {name: Spring Boot before 3, artifact: 'spring-boot(-[a-z-]+)?', group: 'org\.springframework\.boot', versions: '<3', eol_date: '2023-11-24', replacement: 'Spring Boot 4', by_target: {'wildfly-gke,none': {replacement: 'a supported Spring Boot release (3.5 or 4)'}}}
