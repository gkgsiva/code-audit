    - {name: Spring Security before 6, artifact: 'spring-security-[a-z]+', group: 'org\.springframework\.security', versions: '<6', eol_date: '2024-02-28', replacement: 'Spring Security 7 (Spring Boot 4)', by_target: {'wildfly-gke,none': {replacement: 'Spring Security 6.5 or 7'}}}
    - {name: Spring Framework before 6, artifact: 'spring(-[a-z]+)*', group: 'org\.springframework', versions: '<6', eol_date: '2024-08-31', replacement: 'Spring Framework 7 (Spring Boot 4)', by_target: {'wildfly-gke,none': {replacement: 'Spring Framework 6.2 or 7 (Jakarta EE)'}}}
