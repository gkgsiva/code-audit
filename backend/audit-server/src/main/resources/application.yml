# legacy-audit backend. Every value can be set from the environment (docker-compose.yml).
server:
  port: ${LEGACY_AUDIT_PORT:8080}
  servlet:
    session:
      timeout: ${LEGACY_AUDIT_SESSION_HOURS:12}h
      cookie:
        name: LEGACY_AUDIT_SESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: legacy-audit
  datasource:
    url: ${LEGACY_AUDIT_DB_URL:jdbc:postgresql://localhost:5432/legacyaudit}
    username: ${LEGACY_AUDIT_DB_USER:legacyaudit}
    password: ${LEGACY_AUDIT_DB_PASSWORD:legacyaudit}
  flyway:
    locations: classpath:db/migration

legacy-audit:
  # dummy = test login (name only). okta comes later.
  auth: ${LEGACY_AUDIT_AUTH:dummy}
  # These user names are always admins (comma-separated).
  admins: ${LEGACY_AUDIT_ADMINS:admin}
  # One sub-folder per project: audit.yaml, audit-inputs/ and the scan results.
  audits-root: ${LEGACY_AUDIT_AUDITS_ROOT:./audits}
  # Folders a new project may scan (comma-separated). The folder picker starts there.
  sources-roots: ${LEGACY_AUDIT_SOURCES_ROOT:./sources}
  # Jobs (scans, report builds, AI runs) at the same time and runs kept per project. Empty: the
  # Admin page sets them; a number fixes them (shown as locked on the Admin page).
  max-scans: ${LEGACY_AUDIT_MAX_SCANS:}
  keep-runs: ${LEGACY_AUDIT_KEEP_RUNS:}

logging:
  # The server log the Logs page shows to admins (the container sets it under the audits
  # folder); empty: the log goes to the console only. Kept as server.log, then
  # server.log.<date>.<n> (10 MB each, 5 days).
  file:
    name: ${LEGACY_AUDIT_LOG_FILE:}
  logback:
    rollingpolicy:
      file-name-pattern: ${LEGACY_AUDIT_LOG_FILE:server.log}.%d{yyyy-MM-dd}.%i
      max-file-size: 10MB
      max-history: 5
  level:
    # Chromium's PDFs trip harmless structure warnings when the report pages are joined.
    org.apache.pdfbox: ERROR
