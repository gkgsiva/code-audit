[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "legacy-audit"
dynamic = ["version"]
description = "Deterministic audit of legacy applications before migration to Java 25, Spring Boot 4, Angular 21, PostgreSQL and GCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "charset-normalizer>=3.3",
    "pathspec>=0.12",
    "sqlglot>=30,<31",
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "jsonschema>=4.21",
]

[project.scripts]
legacy-audit = "legacy_audit.cli:app"

[tool.hatch.version]
path = "legacy_audit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["legacy_audit"]

# Rule packs ship inside the package (legacy_audit/_rules) so an installed tool finds them.
[tool.hatch.build.targets.wheel.force-include]
"rules" = "legacy_audit/_rules"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "legacy_audit.*"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
