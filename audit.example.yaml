# legacy-audit configuration. Relative paths are resolved from this file's folder.
# Both / and \ work as path separators. Unknown keys are rejected.

application:
  name: "my-application"  # shown in every report
  # description: "Customer billing (Struts 1 + Oracle)"
  # owner: "Migration team A"

# Where the code is. Default: the folder holding this file.
source:
  type: local                    # local | git
  paths:
    - "."
# Optional Git source: the tool clones into ~/.legacy-audit/cache (outside this workspace).
# source:
#   type: git
#   repos:
#     - url: https://github.example.com/team/billing.git
#       ref: main                # branch, tag or commit; default branch if omitted
#       paths: ["billing-web"]   # optional sub-paths to scan
#       token_env: GIT_TOKEN     # name of an env var holding a read-only token (never the token)
#   cache_dir: null              # default ~/.legacy-audit/cache

# Files to scan, in .gitignore syntax. Default excludes (.git, node_modules, target/, build/,
# dist/, out/, IDE folders) always apply unless inventory.use_default_excludes is false.
include:
  - "**"
exclude: []
#  - "docs/**"
#  - "**/*.bak"

# Optional manual component list. Files under these folders belong to the named component;
# everything else is detected automatically (one component per build file or top folder).
components: []
#  - name: billing-web
#    path: web
#    type: web                   # web | batch | cft | script | report | library | db | unknown

inputs_dir: audit-inputs         # late inputs: autosys/, mq/, cft/, ddl/, crontab/, server-config/
output_dir: audit-output         # runs/<run-id>/ and latest/
overrides_file: audit-overrides.yaml

# Target stack (used by mapping rules and reports).
target:
  java: "25"
  spring_boot: "4.1"
  angular: "21"
  database: postgresql
  cloud: gcp

# Counting rules printed in every report. Defaults come from docs/plan.md; override any entry
# by giving its text here, e.g.:
# counting:
#   screen: "One JSP that is a forward target; tiles and fragments are partials."
counting: {}

# Complexity bands. Score = sum of weight x (feature / scale) over: loc and cyclomatic of the
# code an item runs, tables, integrations, vendor-specific SQL statements, fan-out and (screens)
# fields. Simple < medium <= Medium < complex <= Complex < very_complex <= Very complex.
# Changing these re-computes bands and effort on the next run without re-analysing files.
complexity:
  weights:
    loc: 1.0
    cyclomatic: 2.0
    tables: 1.5
    integrations: 2.0
    vendor_sql: 1.5
    fan_out: 1.0
    fields: 0.2
  scale:
    loc: 100                     # per 100 lines of code
    cyclomatic: 10               # per 10 decision points
  thresholds:
    medium: 10
    complex: 25
    very_complex: 50
  high_unit: 20                  # a function from this cyclomatic complexity is a finding

metrics:
  duplication_tokens: 50         # tokens in a window counted as duplicated code

# Rule packs (rules/*.yaml). Switch rules off or change their severity by id; a team folder of
# packs can add rules or replace ours with the same id.
rules:
  enabled: [risk, postgresql, dependency]
  disabled: []
  severity: {}                 # e.g. {system-exit: low}
  packs_dir: null

# Effort estimate in person-days [low, likely, high] per item and level. Only the entries given
# here replace the defaults (see docs/plan.md § Effort model); every output labels the result
# "estimate — weights from config".
effort:
  enabled: true
  weights: {}                  # e.g. {service: {complex: [4, 7, 10]}}

# Dependency security. Tools are optional: when one is missing the run reports a coverage gap.
# Recorded JSON reports dropped in audit-inputs/security/ are imported instead of running a tool.
security:
  dependency_check:
    enabled: true
    path: null                   # dependency-check(.bat); found on PATH when empty
    data_dir: null               # local NVD database folder
    nvd_mirror_url: null         # team mirror, only used when syncing the database
    offline: true                # never update the database during a scan
    timeout_minutes: 30
  osv_scanner:
    enabled: true
    path: null
    data_dir: null
    offline: true
    timeout_minutes: 15
  jdk_tools:
    enabled: false               # true: run jdeps / jdeprscan on jars (needs a JDK; slow)
    java_home: null

# Report branding for the HTML reports. The PowerPoint always uses a corporate template from
# templates/ (its own colours, fonts and logo); pptx_template picks which: blue, orange or purple.
branding:
  theme: neutral
  logo: null
  primary_color: "#1f4e79"
  accent_color: "#2e75b6"
  font: "Segoe UI, Arial, sans-serif"
  pptx_template: null           # null: the first template (Blue); or blue, orange, purple, a .potx path

inventory:
  include_binaries: false        # images/objects/executables; jar/war/ear/zip are always listed
  max_file_size_mb: 20           # larger files are hashed but not read
  workers: 0                     # analysis processes; 0 = one per CPU less one (max 8)
  use_default_excludes: true

# Dialect of SQL embedded in code and scripts (oracle, db2, sqlserver, sybase, mysql, postgresql).
sql:
  dialect: oracle

cobol:
  copybook_paths: []             # folders searched first for COPY members, e.g. ["copybooks"]
  sql_dialect: db2

# AI enrichment. By default analysts run /audit-enrich in VS Code Copilot Chat and pick the model
# there (copilot_model pins one in the agent file). To use any other model, set provider and
# model, then run `legacy-audit enrich`. Scans never call a model. The API key is read from the
# environment variable named in api_key_env (never write the key here).
ai:
  provider: copilot              # copilot | openai | anthropic | azure-openai | ollama
  model: null                    # e.g. gpt-4.1, claude-sonnet-4-5, llama3.1; Azure: deployment
  base_url: null                 # OpenAI-compatible gateway, Gemini, LM Studio, vLLM...; Azure: https://<resource>.openai.azure.com
  api_key_env: null              # default OPENAI_API_KEY, ANTHROPIC_API_KEY or AZURE_OPENAI_API_KEY
  api_version: "2024-10-21"      # azure-openai only
  temperature: 0.1               # null leaves the model's default
  max_output_tokens: 16000
  json_mode: true                # false if the endpoint rejects response_format
  context_chars: 150000          # facts and source sent per stage (about 4 characters per token)
  timeout_seconds: 600
  repair_rounds: 2               # times the validator's errors are sent back to the model
  ca_bundle: null                # corporate CA certificates (PEM) for a TLS-inspecting proxy
  copilot_model: null            # e.g. "Claude Sonnet 4.5 (copilot)"; empty = picked in the chat
